<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PraiseSync Books Web</title>
  <meta name="description" content="Libros y Biblias. Compra fácil por WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado__fila">
      <a class="marca" href="./">
        <span class="marca__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M12 7v6M9 10h6"/></svg>
        </span>
        <span id="nombre-tienda">PraiseSync Books Web</span>
      </a>
      <a class="boton boton--contorno" id="whatsapp-general" href="#" target="_blank" rel="noopener">Escríbenos</a>
    </div>
  </header>

  <main>
    <section class="portada">
      <div class="contenedor">
        <h1>Libros y Biblias</h1>
        <p>Elige tu libro y pídelo por WhatsApp. Coordinamos el pago y la entrega directamente contigo.</p>
      </div>
    </section>

    <section class="contenedor">
      <div class="controles">
        <label class="buscador">
          <span class="visualmente-oculto">Buscar</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="buscar" type="search" placeholder="Buscar por título, autor o categoría" autocomplete="off">
        </label>
        <div class="categorias" id="categorias" role="tablist" aria-label="Categorías"></div>
      </div>

      <p class="estado" id="estado" aria-live="polite">Cargando catálogo…</p>
      <div class="grilla" id="grilla"></div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <!-- Aquí irán las políticas de compra (entregas, envíos, formas de pago) cuando estén definidas. -->
      <p>© <span id="anio"></span> PraiseSync Books Web · Pedidos por WhatsApp</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
